version: '3.8'

services:
  app:
    build: .
    container_name: ludustar_platform
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=ludustar_production_super_secret_key_2026
    volumes:
      - ./server/data:/app/server/data
